         Without it the bottom navigation bar sits UNDER the home indicator on
         an iPhone -- the one control the whole mobile layout is built around,
         permanently half-covered. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <title>Balance Forecast</title>
  </head>
